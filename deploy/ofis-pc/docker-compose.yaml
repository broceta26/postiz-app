# Postiz for the always-on office PC (Windows + Docker Desktop).
# Differs from the root docker-compose.yaml on purpose:
# - image pinned (no surprise upgrades while nobody is watching)
# - secrets and URLs come from .env (generated by install.ps1, never committed)
# - every database uses a NAMED volume, so a re-create never drops scheduled posts
# - ports bound to 127.0.0.1 only; the public HTTPS entry is Tailscale Funnel
# - no spotlight / admin-tools / temporal-ui
name: postiz

services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:v2.25.0
    container_name: postiz
    restart: always
    env_file: .env
    # Public resolver: the app fetches its own FRONTEND_URL/uploads/... for LinkedIn/X.
    # The host's MagicDNS would answer with a 100.x tailnet IP, which the SSRF guard blocks.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      DATABASE_URL: 'postgresql://postiz-user:${POSTGRES_PASSWORD}@postiz-postgres:5432/postiz-db'
      REDIS_URL: 'redis://postiz-redis:6379'
      BACKEND_INTERNAL_URL: 'http://localhost:3000'
      TEMPORAL_ADDRESS: 'temporal:7233'
      IS_GENERAL: 'true'
      STORAGE_PROVIDER: 'local'
      UPLOAD_DIRECTORY: '/uploads'
      NEXT_PUBLIC_UPLOAD_DIRECTORY: '/uploads'
      NX_ADD_PLUGINS: 'false'
      # *.ts.net is a public suffix, so a cookie for ".ts.net" is dropped by browsers;
      # NOT_SECURED makes the frontend store a host-only auth cookie from the "auth" header
      NOT_SECURED: 'true'
      # re-queues posts whose Temporal workflow went missing (hourly check)
      RUN_CRON: 'true'
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    ports:
      - '127.0.0.1:4007:5000'
    networks:
      - postiz-network
      - temporal-network
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      temporal:
        condition: service_started

  postiz-postgres:
    image: postgres:17-alpine
    container_name: postiz-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: postiz-user
      POSTGRES_DB: postiz-db
    volumes:
      - postiz-postgres-data:/var/lib/postgresql/data
    networks:
      - postiz-network
    healthcheck:
      test: pg_isready -U postiz-user -d postiz-db
      interval: 10s
      timeout: 3s
      retries: 3

  postiz-redis:
    image: redis:7.2
    container_name: postiz-redis
    restart: always
    volumes:
      - postiz-redis-data:/data
    networks:
      - postiz-network
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 3

  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    container_name: temporal-elasticsearch
    restart: always
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    volumes:
      - temporal-es-data:/usr/share/elasticsearch/data
    networks:
      - temporal-network
    expose:
      - 9200

  temporal-postgresql:
    image: postgres:16
    container_name: temporal-postgresql
    restart: always
    environment:
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD}
      POSTGRES_USER: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    networks:
      - temporal-network
    expose:
      - 5432

  temporal:
    image: temporalio/auto-setup:1.28.1
    container_name: temporal
    restart: always
    depends_on:
      - temporal-postgresql
      - temporal-elasticsearch
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD}
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    networks:
      - temporal-network
    expose:
      - 7233

volumes:
  postiz-config:
  postiz-uploads:
  postiz-postgres-data:
  postiz-redis-data:
  temporal-es-data:
  temporal-postgres-data:

networks:
  postiz-network:
  temporal-network:
